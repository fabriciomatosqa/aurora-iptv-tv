name: Build Android TV developer APK
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: npm run check && npm test
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: node scripts/sync-android-assets.mjs
      - name: Build unsigned test APK
        working-directory: apps/android-tv
        run: |
          gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-iptv-tv-android-debug-apk
          path: apps/android-tv/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
