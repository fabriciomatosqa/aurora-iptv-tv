name: Verify AURORA IPTV TV prototype
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
      - run: npm test
      - run: npm run package:tv
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-tv-static-dev-packages
          path: |
            dist/samsung-tizen/
            dist/lg-webos/
          if-no-files-found: error
