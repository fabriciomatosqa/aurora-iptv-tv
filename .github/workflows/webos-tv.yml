name: Build LG webOS developer IPK
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
jobs:
  ipk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run check && npm test
      - run: npm run package:tv
      - name: Install official webOS tools
        run: npm install -g @webos-tools/cli@3.2.6
      - name: Package LG developer IPK
        run: |
          mkdir -p dist/artifacts
          ares-config --profile tv
          ares-package --no-minify -o dist/artifacts dist/lg-webos
          find dist/artifacts -name '*.ipk' -type f -size +0c | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-iptv-tv-lg-webos-dev-ipk
          path: dist/artifacts/*.ipk
          if-no-files-found: error
