name: Build LG webOS developer IPK
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
jobs:
  ipk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run check && npm test
      - run: npm run package:tv
      - name: Verify unpacked Simulator app
        run: |
          test -s dist/lg-webos/appinfo.json
          test -s dist/lg-webos/index.html
          test -s dist/lg-webos/src/main.mjs
          test -s dist/lg-webos/lg-tv.css
          test -s dist/lg-webos/lg-ui.mjs
          grep -q 'class="lg-tv"' dist/lg-webos/index.html
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("dist/lg-webos/appinfo.json"));if(!fs.existsSync("dist/lg-webos/"+p.main))process.exit(1)'
      - name: Check LG-specific UI JavaScript
        run: node --check dist/lg-webos/lg-ui.mjs
      - name: Install Chromium for LG UI checks
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test LG UI layout and remote controls
        run: npx playwright test --config playwright.lg.config.mjs
      - name: Upload LG visual test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-iptv-tv-lg-visual-tests
          path: |
            dist/lg-visual-report/
            test-results/
          if-no-files-found: ignore
      - name: Upload webOS TV 26 Simulator folder
        uses: actions/upload-artifact@v4
        with:
          name: aurora-iptv-tv-lg-simulator-folder
          path: dist/lg-webos/
          include-hidden-files: true
          if-no-files-found: error
      - name: Install official webOS tools
        run: npm install -g @webos-tools/cli@3.2.6
      - name: Package LG developer IPK
        run: |
          mkdir -p dist/artifacts
          ares-config --profile tv
          ares-package --no-minify -o dist/artifacts dist/lg-webos
          find dist/artifacts -name '*.ipk' -type f -size +0c | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-iptv-tv-lg-webos-dev-ipk
          path: dist/artifacts/*.ipk
          if-no-files-found: error
