name: Verify Android TV cached restart
on:
  pull_request:
  workflow_dispatch:
jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: node scripts/sync-android-assets.mjs
      - run: gradle -p apps/android-tv :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Enable acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_720p
          ram-size: 3072M
          disk-size: 8192M
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb reconnect offline
            timeout 120 adb wait-for-device
            adb install -r apps/android-tv/app/build/outputs/apk/debug/app-debug.apk
            adb install -r apps/android-tv/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class br.com.auroraiptv.tv.RestartFixtureTest -e restartFixture true br.com.auroraiptv.tv.test/androidx.test.runner.AndroidJUnitRunner | tee restart-seed.txt
            grep -q 'OK (1 test)' restart-seed.txt
            node scripts/verify-android-restart.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurora-android-tv-cached-restart
          path: |
            restart-seed.txt
            apps/android-tv/app/build/catalog-evidence/
